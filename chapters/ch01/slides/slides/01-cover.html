<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #fbfaf5; font-family: "PingFang SC","Noto Sans SC",-apple-system,sans-serif;
    color: #2d2a26;
  }
  .page {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 80px 120px;
  }
  .chapter-tag {
    font-size: 22px; letter-spacing: 0.15em;
    color: #2e6b6e; margin-bottom: 40px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 64px; font-weight: 700;
    line-height: 1.3; text-align: center;
    margin-bottom: 24px; letter-spacing: 0.02em;
  }
  .subtitle {
    font-size: 34px; color: #6b6358;
    text-align: center; margin-bottom: 60px;
    line-height: 1.5;
  }
  .meta {
    display: flex; gap: 40px;
    font-size: 20px; color: #8c8276;
  }
  .meta span { display: flex; align-items: center; gap: 8px; }
  .corner-mark {
    position: absolute; top: 60px; right: 80px;
    font-size: 14px; color: #c4beb2; letter-spacing: 0.1em;
  }
</style></head>
<body>
  <div class="page">
    <div class="chapter-tag">RISC-V Linux 嵌入式编程技术 · 第一章</div>
    <h1>开发环境篇</h1>
    <div class="subtitle">
      RISC-V 平台认知 · 开发环境安装 · 镜像烧录与启动<br>
      <span style="font-size:20px;color:#8c8276;">— 1.1 / 1.2 / 1.3 —</span>
    </div>
    <div class="meta">
      <span>目标平台：LicheePi 4A / TH1520</span>
      <span>操作系统：RevyOS</span>
      <span>工具链：ruyi + GNU Toolchain</span>
    </div>
  </div>
  <div class="corner-mark">01 / 15</div>
</body>
</html>
