<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .hero {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 48px;
    flex: 1;
    min-height: 0;
    align-items: stretch;
  }
  .copy { display: flex; flex-direction: column; justify-content: center; }
  .meta { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; font-size: 20px; color: var(--faint); }
  .photo-wrap {
    min-height: 0;
    border: 1px solid var(--line);
    overflow: hidden;
    background: #1a1a18;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }
  .brand span { font-size: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="slide">
  <div class="hero">
    <div class="copy">
      <div class="brand">
        <img class="logo" src="../assets/ruyi-logo.svg" alt="RuyiSDK">
        <span>RuyiSDK · 荔枝派 4A · C</span>
      </div>
      <p class="kicker">RISC-V Linux 嵌入式实践课</p>
      <h1>在真板上，用 C<br>把温控一路做完</h1>
      <p class="lead">从交叉编译通道，到风扇听温度、命令能改阈值。一门课一条线。</p>
      <div class="meta">
        <span>六章讲义 + 本章实验 · 综合：端侧 Agent 环境终端</span>
        <a class="home-link" href="https://enzoding-rgb.github.io/ruyi-riscv-book/" target="_blank" rel="noopener">enzoding-rgb.github.io/ruyi-riscv-book</a>
      </div>
    </div>
    <div class="photo-wrap">
      <img class="photo" src="../assets/board.jpg" alt="荔枝派 4A 接线">
    </div>
  </div>
</div>
</body>
</html>
