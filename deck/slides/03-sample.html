<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>打开看一眼</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    flex: 1;
    min-height: 0;
    margin-top: 16px;
  }
  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .pane .label {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--text);
  }
  .pane .label span { font-weight: 500; color: var(--muted); font-size: 16px; }
  .frame {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #fff;
    border: 1px solid var(--line);
  }
  .frame iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 2200px;
    border: 0;
    transform: scale(0.68);
    transform-origin: top left;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="slide">
  <p class="kicker">学生每周打开的东西</p>
  <h1>讲义能跟做，实验能勾验收</h1>
  <p class="lead">左边第一章讲义：装 RuyiSDK、交叉编译，打开就能往下跟。右边第四章实验：接线、脚手架、验收表。这一页只为让你看见材料长什么样。</p>
  <div class="body">
    <div class="pane">
      <div class="label">ch01 讲义 <span>跟做 · 工具链进门</span></div>
      <div class="frame">
        <iframe src="/chapters/ch01/lecture.html" title="第一章讲义"></iframe>
      </div>
    </div>
    <div class="pane">
      <div class="label">ch04 实验 <span>验收 · 命令温控</span></div>
      <div class="frame">
        <iframe src="/chapters/ch04/lab.html" title="第四章实验"></iframe>
      </div>
    </div>
  </div>
</div>
</body>
</html>
