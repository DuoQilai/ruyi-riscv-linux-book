<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>打开看一眼</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    flex: 1;
    min-height: 0;
    margin-top: 16px;
  }
  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .pane .label {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--text);
  }
  .pane .label span { font-weight: 500; color: var(--muted); font-size: 16px; }
  .frame {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #fff;
    border: 1px solid var(--line);
  }
  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: top center;
    background: #fbfaf5;
  }
</style>
</head>
<body>
<div class="slide">
  <p class="kicker">学生每周打开的东西</p>
  <h1>讲义能跟做，实验能勾验收</h1>
  <p class="lead">左边是第一章讲义 §1.1：装 RuyiSDK、激活工具链，打开就能往下敲。右边是第四章实验的联调验收。这一页只为让你看见材料长什么样。</p>
  <div class="body">
    <div class="pane">
      <div class="label">ch01 讲义 <span>§1.1 安装 RuyiSDK</span></div>
      <div class="frame">
        <img src="../assets/sample-ch01-lecture.png" alt="第一章讲义：安装 RuyiSDK 跟做步骤">
      </div>
    </div>
    <div class="pane">
      <div class="label">ch04 实验 <span>联调验收 · status / set</span></div>
      <div class="frame">
        <img src="../assets/sample-ch04-lab.png" alt="第四章实验：联调验收与终端截图">
      </div>
    </div>
  </div>
</div>
</body>
</html>
