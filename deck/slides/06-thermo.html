<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>温控线</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .grid-3 { margin-top: 28px; }
  .card h2 { font-size: 30px; }
  .card p { font-size: 22px; }
</style>
</head>
<body>
<div class="slide">
  <p class="kicker">已验证的核心递进</p>
  <h1>假温度 → 真风扇 → 真传感器</h1>
  <p class="lead">前四章已经能在板上演示。下一页用一张架构图看第三、四章怎么接在一起。</p>
  <div class="grid-3">
    <div class="card">
      <span class="tag env">ch02</span>
      <h2>软件里先会判</h2>
      <p>按契约写出滞回；改读数坑。这一章不上板。</p>
    </div>
    <div class="card">
      <span class="tag board">ch03</span>
      <h2>假温度驱动真风扇</h2>
      <p>gpiod 控继电器。超阈值转、降温停。</p>
    </div>
    <div class="card">
      <span class="tag linux">ch04</span>
      <h2>真 DHT + 命令</h2>
      <p>敲 <code>status</code> 有回复；<code>set temp</code> 立刻改阈值。</p>
    </div>
  </div>
</div>
</body>
</html>
