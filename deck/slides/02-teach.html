<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>怎么教</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .grid-2 { margin-top: 28px; }
  .card { justify-content: flex-start; }
  .card h2 { font-size: 32px; margin-bottom: 18px; }
  .card p { font-size: 24px; margin-bottom: 16px; }
  .card li { font-size: 24px; }
</style>
</head>
<body>
<div class="slide">
  <p class="kicker"><span class="ke">🧭</span> 课程怎么组织</p>
  <h1>讲义学会，实验交得出</h1>
  <p class="lead">同一条故事线往前走。讲义把概念在第一次出现时讲透；实验端出一道板上可见的验收。往后六章各一页，最后合成综合项目。</p>
  <div class="grid-2">
    <div class="card">
      <span class="tag env">讲义 lecture</span>
      <h2>零件是什么、接口怎么用</h2>
      <p>讲义讲清每个零件是什么、怎么用，配跟做小例子，不要求有基础。</p>
      <ul>
        <li>每章固定三节</li>
        <li>概念只在首次出现处讲透</li>
      </ul>
    </div>
    <div class="card">
      <span class="tag lab">本章实验 lab</span>
      <h2>C 脚手架 + 板上可见验收</h2>
      <p>学生按约定把代码补全：风扇能开能关、敲命令有回复，并填记录表。</p>
      <ul>
        <li>教师用 <code>make sol</code> 对照</li>
        <li>实验只写与讲义不同的步骤，安装和 <code>make</code> 见讲义</li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
