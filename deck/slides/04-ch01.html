<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一章</title>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide">
  <p class="kicker">第一章 · 环境与工具链</p>
  <h1>装上如意 SDK，交叉编译上板跑分</h1>
  <p class="lead">RuyiSDK 从这一章立起招牌：§1.1 把它装进工具链，后面每章的代码都靠它交叉编译。</p>
  <div class="ch-body">
    <div class="ch-copy">
      <div class="brand-row">
        <img class="logo" src="../assets/ruyi-logo.svg" alt="RuyiSDK" style="height:56px">
      </div>
      <ul>
        <li>认识荔枝派 4A，烧录 RevyOS，打通 SSH 与文件传输。</li>
        <li>入口 <code>. ~/venv-gnu-ruyisdk/bin/ruyi-activate</code></li>
        <li>三元组钉死 <code>riscv64-ruyisdk-linux-gnu</code></li>
        <li>编 CoreMark：<code>file</code> 认 RISC-V，上板跑出分数。</li>
      </ul>
      <div class="card">
        <h2>本章实验</h2>
        <p>同一份源码：x86 上交叉编译验收，板上用本机 <code>gcc</code> 再跑一遍。</p>
      </div>
    </div>
    <div class="shots">
      <figure class="shot">
        <img src="../assets/coremark-cross.png" alt="x86 上 RuyiSDK 交叉编译 CoreMark">
        <figcaption>x86：激活 RuyiSDK，<code>file</code> 看到 RISC-V</figcaption>
      </figure>
      <figure class="shot">
        <img src="../assets/ch01-board.png" alt="荔枝派上本机编译运行 CoreMark">
        <figcaption>荔枝派：本机 <code>make</code>，跑出 CoreMark 分数</figcaption>
      </figure>
    </div>
  </div>
</div>
</body>
</html>
