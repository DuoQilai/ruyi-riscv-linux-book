<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第六章</title>
<link rel="stylesheet" href="../theme.css">
<style>
  h1 { font-size: 44px; margin-bottom: 10px; }
  .lead { font-size: 22px; max-width: 1680px; margin-bottom: 18px; }
  .body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 28px;
    align-items: stretch;
  }
  .fig-col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .fig {
    background: #fff;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    flex: 1;
  }
  .fig svg { flex: 1; min-height: 0; width: 100%; padding: 10px 14px 4px; }
  .fig img {
    flex: 1;
    min-height: 0;
    width: 100%;
    object-fit: contain;
    background: #fff;
    padding: 10px 14px;
  }
  .fig figcaption {
    font-size: 15px;
    color: var(--faint);
    padding: 8px 14px 12px;
    border-top: 1px solid var(--line-light);
    line-height: 1.4;
  }
  .tri {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .th {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 5px solid var(--warm);
    padding: 12px 16px;
  }
  .th strong { display: block; font-size: 20px; margin-bottom: 3px; }
  .th span { font-size: 17px; color: var(--muted); line-height: 1.4; }
  .copy .card { padding: 18px 22px; }
  .copy .card h2 { font-size: 21px; }
  .copy .card p { font-size: 18px; }
</style>
</head>
<body>
<div class="slide">
  <p class="kicker">🧵 第六章 · 线程与协同</p>
  <h1>风扇不能等网络</h1>
  <p class="lead">三条线程各跑各的周期；共用 <code>last_temp</code> 必须加锁。通信线程等 MQTT 时，采集和控制仍按时工作。</p>
  <div class="body">
    <div class="fig-col">
      <figure class="fig">
        <svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" aria-label="三线程架构">
          <defs>
            <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2e6b6e"/></marker>
            <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c46b4a"/></marker>
          </defs>
          <rect x="12" y="28" width="168" height="58" rx="8" fill="#e2f0e4" stroke="#2e6b6e" stroke-width="2"/>
          <text x="96" y="52" text-anchor="middle" font-size="15" font-weight="700">采集线程</text>
          <text x="96" y="72" text-anchor="middle" font-size="12" fill="#5c5448">每 2s 读 DHT22</text>
          <rect x="12" y="102" width="168" height="58" rx="8" fill="#fff8e6" stroke="#c46b4a" stroke-width="2"/>
          <text x="96" y="126" text-anchor="middle" font-size="15" font-weight="700">控制线程</text>
          <text x="96" y="146" text-anchor="middle" font-size="12" fill="#5c5448">读温度 · 开/关风扇</text>
          <rect x="12" y="176" width="168" height="58" rx="8" fill="#e3eef9" stroke="#2e6b6e" stroke-width="2"/>
          <text x="96" y="200" text-anchor="middle" font-size="15" font-weight="700">通信线程</text>
          <text x="96" y="220" text-anchor="middle" font-size="12" fill="#5c5448">mosquitto_loop</text>
          <rect x="260" y="78" width="200" height="120" rx="10" fill="#f2f0e8" stroke="#2e6b6e" stroke-width="2.5"/>
          <text x="360" y="108" text-anchor="middle" font-size="16" font-weight="700">共享状态</text>
          <text x="360" y="132" text-anchor="middle" font-size="13" fill="#5c5448">last_temp · 阈值</text>
          <rect x="310" y="148" width="100" height="32" rx="6" fill="#2e6b6e"/>
          <text x="360" y="169" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">MUTEX</text>
          <rect x="530" y="28" width="110" height="48" rx="8" fill="#e2f0e4" stroke="#2e6b6e" stroke-width="1.5"/>
          <text x="585" y="58" text-anchor="middle" font-size="13" font-weight="700">DHT22</text>
          <rect x="530" y="106" width="110" height="48" rx="8" fill="#fff8e6" stroke="#c46b4a" stroke-width="1.5"/>
          <text x="585" y="136" text-anchor="middle" font-size="13" font-weight="700">风扇继电器</text>
          <rect x="530" y="184" width="110" height="48" rx="8" fill="#e3eef9" stroke="#2e6b6e" stroke-width="1.5"/>
          <text x="585" y="214" text-anchor="middle" font-size="13" font-weight="700">MQTT</text>
          <rect x="670" y="106" width="96" height="48" rx="8" fill="#ede8f5" stroke="#2e6b6e" stroke-width="1.5"/>
          <text x="718" y="136" text-anchor="middle" font-size="13" font-weight="700">Broker</text>
          <line x1="180" y1="57" x2="256" y2="110" stroke="#2e6b6e" stroke-width="2" marker-end="url(#a1)"/>
          <text x="210" y="72" font-size="11" fill="#2e6b6e">写</text>
          <line x1="180" y1="131" x2="256" y2="128" stroke="#c46b4a" stroke-width="2" marker-end="url(#a2)"/>
          <text x="210" y="122" font-size="11" fill="#c46b4a">读</text>
          <line x1="180" y1="205" x2="256" y2="168" stroke="#2e6b6e" stroke-width="2" marker-end="url(#a1)"/>
          <text x="210" y="198" font-size="11" fill="#2e6b6e">改阈值</text>
          <line x1="460" y1="110" x2="526" y2="52" stroke="#2e6b6e" stroke-width="2" marker-end="url(#a1)"/>
          <line x1="460" y1="138" x2="526" y2="130" stroke="#c46b4a" stroke-width="2" marker-end="url(#a2)"/>
          <line x1="460" y1="168" x2="526" y2="208" stroke="#2e6b6e" stroke-width="2" marker-end="url(#a1)"/>
          <line x1="640" y1="208" x2="668" y2="136" stroke="#2e6b6e" stroke-width="2" marker-end="url(#a1)"/>
          <text x="360" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#2e6b6e">同一进程 · 三条执行流 · 互不阻塞</text>
        </svg>
        <figcaption>tri-thread：采集写温度、控制读温度开风扇、通信跑 MQTT——各按自己的周期</figcaption>
      </figure>
      <figure class="fig">
        <img src="../assets/ch06-mutex.png" alt="互斥锁：Thread 1 正在访问共享资源，Thread 2 被阻塞">
        <figcaption>碰 <code>last_temp</code> 时加锁：一条线在临界区，另一条等待，避免读到写到一半的值</figcaption>
      </figure>
    </div>
    <div class="copy">
      <div class="tri">
        <div class="th"><strong>采集</strong><span>每 2 秒读 DHT22，写 <code>last_temp</code></span></div>
        <div class="th"><strong>控制</strong><span>按阈值开风扇，不等网络返回</span></div>
        <div class="th"><strong>通信</strong><span>MQTT 收发，不阻塞上面两条线</span></div>
      </div>
      <div class="card">
        <span class="tag lab">本章实验</span>
        <h2>三线程 + 无锁错乱 → 加锁修好</h2>
        <p>板上必现一次错乱再修好；电脑 race-demo + TSan 指出抢变量的两行。Ctrl+C 先停风扇。</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
