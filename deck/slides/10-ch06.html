<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第六章</title>
<link rel="stylesheet" href="../theme.css">
<style>
  h1 { font-size: 44px; margin-bottom: 10px; }
  .lead { font-size: 22px; max-width: 1680px; margin-bottom: 18px; }
  .body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1.12fr 0.88fr;
    gap: 32px;
    align-items: stretch;
  }
  .fig {
    background: #fff;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .fig img {
    flex: 1;
    min-height: 0;
    width: 100%;
    object-fit: contain;
    background: #fff;
    padding: 14px 18px;
  }
  .fig figcaption {
    font-size: 16px;
    color: var(--faint);
    padding: 10px 16px 14px;
    border-top: 1px solid var(--line-light);
    line-height: 1.45;
  }
  .tri {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .th {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 5px solid var(--warm);
    padding: 14px 18px;
  }
  .th strong { display: block; font-size: 22px; margin-bottom: 4px; }
  .th span { font-size: 18px; color: var(--muted); line-height: 1.45; }
  .copy .card { padding: 20px 24px; }
  .copy .card h2 { font-size: 22px; }
  .copy .card p { font-size: 19px; }
</style>
</head>
<body>
<div class="slide">
  <p class="kicker">🧵 第六章 · 线程与协同</p>
  <h1>风扇不能等网络</h1>
  <p class="lead">MQTT 通信占一条线程慢慢等套接字；采集和控制各跑各的周期。共用 <code>last_temp</code> 加锁，Ctrl+C 先停风扇。</p>
  <div class="body">
    <figure class="fig">
      <img src="../assets/ch05-mqtt-remote.png" alt="手机经 CloudMQTT 远程控 NodeMCU LED">
      <figcaption>远程指挥：一端发命令，经 Broker 到板端执行——通信线程干的就是这件事</figcaption>
    </figure>
    <div class="copy">
      <div class="tri">
        <div class="th"><strong>采集</strong><span>每 2 秒读 DHT22，写温度</span></div>
        <div class="th"><strong>控制</strong><span>按阈值开风扇，不等网络</span></div>
        <div class="th"><strong>通信</strong><span>MQTT 收发，不阻塞上面两条线</span></div>
      </div>
      <div class="card">
        <span class="tag lab">本章实验</span>
        <h2>三线程 + 干净停</h2>
        <p>板上 tri-thread 同时跑；TSan 在 x86 上指出无锁竞态。综合项目把 MQTT 总线留给 Harness 工具。</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
