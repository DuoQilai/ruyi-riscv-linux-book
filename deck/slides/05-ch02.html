<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第二章</title>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide">
  <p class="kicker"><span class="ke">🌡</span> 第二章 · 够用的 C 语言</p>
  <h1>先在软件里学会判温控，这一章不上板</h1>
  <p class="lead">先用软件学会温控的判据：类型、函数、多文件、指针够用即可。实验从空写出滞回逻辑，再处理读数失败的情况。</p>
  <div class="ch-body">
    <div class="ch-copy">
      <ul>
        <li>按约定写 <code>thermo_update</code>：温度高于上限就开，低于下限就关。</li>
        <li>中间那段温度保持上一状态——这就是滞回。</li>
        <li>读数失败时风扇保持原来的状态，不胡乱切换。</li>
        <li>从键盘喂一串温度，终端能看到风扇开/关和温度对得上。</li>
      </ul>
      <div class="card">
        <h2>本章实验</h2>
        <p>模拟温度先在电脑上跑通；同一份程序也能交叉编译到板子上再跑。这一章还没有继电器。</p>
      </div>
    </div>
    <div class="shots">
      <figure class="shot">
        <img src="../assets/ch02-x86.png" alt="x86 上模拟温度滞回序列">
        <figcaption>x86：喂 25→29→24，风扇按滞回开闭</figcaption>
      </figure>
      <figure class="shot">
        <img src="../assets/ch02-board.png" alt="荔枝派上复跑模拟温度程序">
        <figcaption>荔枝派：同一份模拟温度程序，产物是 RISC-V</figcaption>
      </figure>
    </div>
  </div>
</div>
</body>
</html>
