<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第二章</title>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide">
  <p class="kicker">第二章 · 够用的 C</p>
  <h1>先在软件里学会判温控，这一章不上板</h1>
  <p class="lead">类型、函数、多文件、指针够用即可。实验从空写出滞回，再处理读数失败的坑。</p>
  <div class="ch-body">
    <div class="ch-copy">
      <ul>
        <li>按契约写 <code>thermo_update</code>：高于 bar 开、低于 bar 关。</li>
        <li>中间那段温度保持上一状态——这就是滞回。</li>
        <li>读数失败时风扇保持，不瞎切。</li>
        <li>stdin 喂一串温度，终端能对上开/关序列。</li>
      </ul>
      <div class="card">
        <h2>本章实验</h2>
        <p>模拟温度在 x86 上跑通；同一份也可交叉到板上复跑。还没有继电器。</p>
      </div>
    </div>
    <div class="shots">
      <figure class="shot">
        <img src="../assets/ch02-x86.png" alt="x86 上模拟温度滞回序列">
        <figcaption>x86：喂 25→29→24，风扇按滞回开闭</figcaption>
      </figure>
      <figure class="shot">
        <img src="../assets/ch02-board.png" alt="荔枝派上复跑模拟温度程序">
        <figcaption>荔枝派：同一份模拟温度程序，产物是 RISC-V</figcaption>
      </figure>
    </div>
  </div>
</div>
</body>
</html>
